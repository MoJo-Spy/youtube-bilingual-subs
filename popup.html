<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    width: 240px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 14px;
    margin: 0;
    color: #1f2328;
  }
  h2 { font-size: 14px; margin: 0 0 10px; font-weight: 600; }
  label { display: flex; align-items: center; font-size: 13px; cursor: pointer; padding: 4px 0; }
  label input { margin-right: 8px; }
  button {
    width: 100%;
    padding: 7px;
    font-size: 13px;
    cursor: pointer;
    border: 1px solid #d0d7de;
    background: #f6f8fa;
    border-radius: 6px;
    margin-top: 10px;
    color: #1f2328;
    font-family: inherit;
  }
  button:hover { background: #eaeef2; }
  .status {
    font-size: 11px;
    color: #656d76;
    margin-top: 8px;
    padding: 6px 8px;
    background: #f6f8fa;
    border-radius: 4px;
  }
  .warn { background: #fff8c5; color: #633c01; }
</style>
</head>
<body>
  <h2>YouTube Bilingual Subtitles</h2>
  <label><input type="checkbox" id="enabled"> Enable translation</label>
  <div class="status" id="status">&nbsp;</div>
  <button id="openOptions">Open settings</button>
<script src="popup.js"></script>
</body>
</html>
